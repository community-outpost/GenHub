<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">GenHub profile content settings redesign preview</title>
  <desc id="desc">Static UI preview showing profile items with clear remove and add actions, and explanatory copy that says removal only affects this profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111a"/><stop offset="1" stop-color="#08080d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9b43e5"/><stop offset="1" stop-color="#5c26c9"/></linearGradient>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f1f8; }
      .muted { fill: #a7a3b4; }
      .tiny { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #a7a3b4; }
      .panel { fill: #14141d; stroke: #30303e; stroke-width: 1.5; }
      .item { fill: #1a1a24; stroke: #353541; stroke-width: 1.4; }
      .tag { fill: #252431; stroke: #464255; stroke-width: 1; }
      .btn { fill: #211e2e; stroke: #63517c; stroke-width: 1.2; }
    </style>
  </defs>
  <rect width="1600" height="1040" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="310" height="1040" rx="22" fill="#111119"/>
  <path d="M310 0v1040" stroke="#343341"/>
  <circle cx="76" cy="73" r="33" fill="#161622" stroke="#148be5" stroke-width="3"/>
  <path d="M76 48l7 15 13 3-10 8 3 14-13-7-13 7 3-14-10-8 13-3z" fill="#cbdcf4" stroke="#4b9be1"/>
  <text x="40" y="149" font-size="28" font-weight="700">New Profile</text>
  <text x="42" y="230" font-size="18" class="muted">General</text>
  <rect x="22" y="256" width="266" height="64" rx="14" fill="#30203d"/>
  <rect x="22" y="256" width="5" height="64" rx="2.5" fill="#078fe8"/>
  <text x="44" y="297" font-size="20" font-weight="700">Content</text>
  <text x="42" y="363" font-size="18" class="muted">Appearance</text>
  <text x="42" y="420" font-size="18" class="muted">Video</text>
  <text x="42" y="477" font-size="18" class="muted">Audio</text>
  <text x="42" y="534" font-size="18" class="muted">Controls</text>
  <text x="355" y="93" font-size="36" font-weight="750">Content</text>

  <rect x="355" y="125" width="1195" height="320" rx="16" class="panel"/>
  <text x="390" y="174" font-size="25" font-weight="700">This profile will use</text>
  <text x="390" y="202" font-size="14" class="muted">These items are used when you launch this profile. Removing an item here only removes it from this profile; it stays in your content library.</text>
  <rect x="390" y="230" width="550" height="174" rx="12" class="item"/>
  <text x="416" y="271" font-size="19" font-weight="650">Zero Hour Retail Installation</text>
  <rect x="416" y="291" width="152" height="29" rx="6" class="tag"/>
  <text x="430" y="311" font-size="13" class="muted">Game Installation</text>
  <rect x="416" y="333" width="82" height="28" rx="6" class="tag"/>
  <text x="431" y="352" font-size="13" class="muted">Zero Hour</text>
  <rect x="756" y="352" width="168" height="36" rx="7" fill="#2c1b23" stroke="#b24b57"/>
  <text x="766" y="376" font-size="14" font-weight="650" fill="#ff9aa1">Remove from profile</text>

  <rect x="355" y="470" width="1195" height="470" rx="16" class="panel"/>
  <text x="390" y="519" font-size="25" font-weight="700">Add content to this profile</text>
  <text x="390" y="547" font-size="14" class="muted">Choose a content type and game, then add an item. Added items appear in the list above.</text>
  <rect x="1382" y="490" width="136" height="38" rx="19" class="btn"/>
  <text x="1407" y="515" font-size="13" font-weight="600">↻  Refresh list</text>

  <text x="390" y="593" class="tiny">CONTENT TYPE</text>
  <rect x="390" y="609" width="176" height="46" rx="12" fill="url(#accent)" stroke="#e0d3fb" stroke-width="1.5"/>
  <text x="418" y="638" font-size="15" font-weight="700">▣  Game Client</text>
  <rect x="576" y="609" width="150" height="46" rx="12" fill="#1b1b25" stroke="#474653"/>
  <text x="604" y="638" font-size="15" font-weight="600">✿  Mods</text>
  <rect x="736" y="609" width="138" height="46" rx="12" fill="#1b1b25" stroke="#474653"/>
  <text x="765" y="638" font-size="15" font-weight="600">⌖  Maps</text>
  <rect x="886" y="609" width="144" height="46" rx="12" fill="#1b1b25" stroke="#474653"/>
  <text x="913" y="638" font-size="15" font-weight="600">＋  Add-ons</text>
  <rect x="390" y="680" width="169" height="42" rx="20" class="btn"/>
  <text x="412" y="707" font-size="14" font-weight="600">▱  Import local folder</text>

  <text x="1130" y="706" class="tiny">GAME</text>
  <rect x="1192" y="680" width="142" height="42" rx="20" fill="#1b1b25" stroke="#474653"/>
  <text x="1225" y="707" font-size="14" font-weight="600">Generals</text>
  <rect x="1342" y="680" width="176" height="42" rx="20" fill="url(#accent)" stroke="#e0d3fb" stroke-width="1.5"/>
  <text x="1375" y="707" font-size="14" font-weight="700">Zero Hour</text>

  <rect x="390" y="750" width="730" height="152" rx="12" class="item"/>
  <text x="418" y="790" font-size="19" font-weight="650">zerohour v1.04</text>
  <rect x="418" y="810" width="134" height="28" rx="6" fill="#1d3328" stroke="#3b7850"/>
  <text x="433" y="829" font-size="13" fill="#9ee0ae">Retail</text>
  <rect x="559" y="810" width="95" height="28" rx="6" class="tag"/>
  <text x="574" y="829" font-size="13" class="muted">Game Client</text>
  <rect x="662" y="810" width="58" height="28" rx="6" class="tag"/>
  <text x="677" y="829" font-size="13" class="muted">v1.04</text>
  <rect x="944" y="802" width="168" height="42" rx="8" fill="#2b1940" stroke="#9d55d6"/>
  <text x="958" y="829" font-size="15" font-weight="700">Add to profile</text>
  <text x="1210" y="864" font-size="13" class="muted">Static UI preview</text>
  <text x="356" y="990" font-size="12" class="muted">Design preview based on the revised Avalonia layout; runtime screenshot unavailable in this build environment.</text>
</svg>
