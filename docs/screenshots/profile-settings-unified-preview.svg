<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">GenHub unified profile settings preview</title>
<desc id="desc">Static UI preview of game options grouped in one Settings page by topic, with one setting per row and a temporary New badge on a first-release option.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111a"/><stop offset="1" stop-color="#08080d"/></linearGradient><linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9244e5"/><stop offset="1" stop-color="#6025c7"/></linearGradient><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3f1f8}.muted{fill:#aaa6b6}.dim{fill:#858191}</style></defs>
<rect width="1600" height="1000" rx="20" fill="url(#bg)"/><rect width="290" height="1000" rx="20" fill="#111119"/><path d="M290 0v1000" stroke="#343341"/><circle cx="73" cy="72" r="34" fill="#161622" stroke="#148be5" stroke-width="3"/><path d="M73 46l8 17 17 4-13 11 4 18-16-9-16 9 4-18-13-11 17-4z" fill="#cbdcf4" stroke="#4b9be1"/><text x="38" y="147" font-size="28" font-weight="700">New Profile</text><text x="42" y="222" font-size="17" class="muted">General</text><text x="42" y="286" font-size="17" class="muted">Game</text><text x="42" y="352" font-size="17" class="muted">Content</text><rect x="20" y="382" width="250" height="56" rx="12" fill="#30203d"/><rect x="20" y="382" width="4" height="56" rx="2" fill="#078fe8"/><text x="42" y="418" font-size="17" font-weight="700">Settings</text>
<text x="340" y="92" font-size="34" font-weight="750">Settings</text><text x="340" y="126" font-size="15" class="muted">Game options, grouped by what they change.</text>
<!-- video -->
<rect x="340" y="160" width="1208" height="322" rx="16" fill="#14141d" stroke="#30303e" stroke-width="1.5"/><text x="376" y="206" font-size="21" font-weight="700">Video</text>
<g font-size="15"><text x="392" y="252">Resolution</text><rect x="1210" y="226" width="294" height="40" rx="7" fill="#1b1b25" stroke="#474653"/><text x="1230" y="251" class="muted">1920 × 1080</text><path d="M1480 242l7 7 7-7" fill="none" stroke="#aaa6b6" stroke-width="2"/>
<path d="M376 280h1136" stroke="#292834"/><text x="392" y="316">Texture quality</text><rect x="1210" y="290" width="294" height="40" rx="7" fill="#1b1b25" stroke="#474653"/><text x="1230" y="315" class="muted">High</text><path d="M1480 306l7 7 7-7" fill="none" stroke="#aaa6b6" stroke-width="2"/>
<path d="M376 344h1136" stroke="#292834"/><text x="392" y="380">Windowed mode</text><rect x="1447" y="356" width="48" height="26" rx="13" fill="#5c2a99" stroke="#9b6cc4"/><circle cx="1482" cy="369" r="9" fill="#f4efff"/>
<path d="M376 408h1136" stroke="#292834"/><text x="392" y="444">Brightness</text><rect x="1210" y="434" width="205" height="5" rx="3" fill="#393544"/><rect x="1210" y="434" width="112" height="5" rx="3" fill="#9861d2"/><circle cx="1322" cy="436" r="8" fill="#d9c3f0"/><text x="1450" y="444" font-size="13" class="muted">55</text></g>
<!-- audio and controls -->
<rect x="340" y="504" width="1208" height="198" rx="16" fill="#14141d" stroke="#30303e" stroke-width="1.5"/><text x="376" y="550" font-size="21" font-weight="700">Audio</text><text x="392" y="592" font-size="15">Audio enabled</text><rect x="1447" y="573" width="48" height="26" rx="13" fill="#5c2a99" stroke="#9b6cc4"/><circle cx="1482" cy="586" r="9" fill="#f4efff"/><path d="M376 614h1136" stroke="#292834"/><text x="392" y="656" font-size="15">Sound volume</text><rect x="1210" y="646" width="205" height="5" rx="3" fill="#393544"/><rect x="1210" y="646" width="144" height="5" rx="3" fill="#9861d2"/><circle cx="1354" cy="648" r="8" fill="#d9c3f0"/><text x="1450" y="656" font-size="13" class="muted">70</text>
<rect x="340" y="724" width="1208" height="200" rx="16" fill="#14141d" stroke="#30303e" stroke-width="1.5"/><text x="376" y="770" font-size="21" font-weight="700">Controls &amp; gameplay</text><text x="392" y="812" font-size="15">Scroll speed</text><rect x="1210" y="802" width="205" height="5" rx="3" fill="#393544"/><rect x="1210" y="802" width="126" height="5" rx="3" fill="#9861d2"/><circle cx="1336" cy="804" r="8" fill="#d9c3f0"/><text x="1450" y="812" font-size="13" class="muted">120</text><path d="M376 834h1136" stroke="#292834"/><text x="392" y="876" font-size="15">Screen edge scroll in windowed mode</text><rect x="685" y="857" width="48" height="24" rx="6" fill="#183542" stroke="#3d8ca7"/><text x="694" y="874" font-size="11" font-weight="700" fill="#a4e7f5">NEW</text><rect x="1447" y="853" width="48" height="26" rx="13" fill="#5c2a99" stroke="#9b6cc4"/><circle cx="1482" cy="866" r="9" fill="#f4efff"/>
<text x="340" y="962" font-size="12" class="dim">Static UI preview · “NEW” marks a first-release addition and is temporary</text>
</svg>
