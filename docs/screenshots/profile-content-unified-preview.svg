<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">GenHub profile content unified list preview</title>
<desc id="desc">Static UI preview of a profile Content page with category tabs and one checkbox list for content selected in the profile. Rows show item names and useful version or source details, without generic descriptions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111a"/><stop offset="1" stop-color="#08080d"/></linearGradient>
  <linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9244e5"/><stop offset="1" stop-color="#6025c7"/></linearGradient>
  <style>
    text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3f1f8}
    .muted{fill:#aaa6b6}.dim{fill:#858191}.small{font-size:13px}.tag{font-size:12px;fill:#c6c1d2}
  </style>
</defs>
<rect width="1600" height="1000" rx="20" fill="url(#bg)"/>
<rect width="290" height="1000" rx="20" fill="#111119"/><path d="M290 0v1000" stroke="#343341"/>
<circle cx="73" cy="72" r="34" fill="#161622" stroke="#148be5" stroke-width="3"/><path d="M73 46l8 17 17 4-13 11 4 18-16-9-16 9 4-18-13-11 17-4z" fill="#cbdcf4" stroke="#4b9be1"/>
<text x="38" y="147" font-size="28" font-weight="700">New Profile</text>
<text x="42" y="222" font-size="17" class="muted">General</text>
<rect x="20" y="250" width="250" height="56" rx="12" fill="#211b2e"/><text x="42" y="286" font-size="17" class="muted">Game</text>
<rect x="20" y="316" width="250" height="56" rx="12" fill="#30203d"/><rect x="20" y="316" width="4" height="56" rx="2" fill="#078fe8"/><text x="42" y="352" font-size="17" font-weight="700">Content</text>
<text x="42" y="418" font-size="17" class="muted">Settings</text>
<text x="340" y="92" font-size="34" font-weight="750">Content</text>
<text x="340" y="126" font-size="15" class="muted">Choose the maps, mods, and add-ons this profile should use.</text>
<rect x="1320" y="69" width="228" height="48" rx="10" fill="#211e2e" stroke="#63517c"/><text x="1350" y="99" font-size="14" font-weight="650">＋  Import local folder</text>
<rect x="340" y="160" width="1208" height="638" rx="16" fill="#14141d" stroke="#30303e" stroke-width="1.5"/>
<text x="376" y="210" font-size="22" font-weight="700">Zero Hour content</text>
<text x="376" y="239" font-size="14" class="muted">Select the items to include in this profile. Checked items are used when you launch it.</text>
<rect x="376" y="270" width="126" height="42" rx="9" fill="url(#active)" stroke="#d9c6f7"/><text x="416" y="297" font-size="14" font-weight="700">Mods</text>
<rect x="510" y="270" width="126" height="42" rx="9" fill="#1b1b25" stroke="#474653"/><text x="546" y="297" font-size="14" font-weight="600" class="muted">Maps</text>
<rect x="644" y="270" width="146" height="42" rx="9" fill="#1b1b25" stroke="#474653"/><text x="674" y="297" font-size="14" font-weight="600" class="muted">Add-ons</text>
<text x="390" y="354" font-size="11" font-weight="700" letter-spacing="1.2" class="dim">MOD</text>
<text x="1042" y="354" font-size="11" font-weight="700" letter-spacing="1.2" class="dim">VERSION / SOURCE</text>
<text x="1432" y="354" font-size="11" font-weight="700" letter-spacing="1.2" class="dim">IN PROFILE</text>
<path d="M376 372h1136" stroke="#30303e"/>
