<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">GenHub profile game and client selection preview</title>
<desc id="desc">Static UI preview showing a single-choice game selection and a single-choice list of available game clients.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11111a"/><stop offset="1" stop-color="#08080d"/></linearGradient><linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9244e5"/><stop offset="1" stop-color="#6025c7"/></linearGradient><style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#f3f1f8}.muted{fill:#aaa6b6}.dim{fill:#858191}</style></defs>
<rect width="1600" height="1000" rx="20" fill="url(#bg)"/><rect width="290" height="1000" rx="20" fill="#111119"/><path d="M290 0v1000" stroke="#343341"/>
<circle cx="73" cy="72" r="34" fill="#161622" stroke="#148be5" stroke-width="3"/><path d="M73 46l8 17 17 4-13 11 4 18-16-9-16 9 4-18-13-11 17-4z" fill="#cbdcf4" stroke="#4b9be1"/><text x="38" y="147" font-size="28" font-weight="700">New Profile</text><text x="42" y="222" font-size="17" class="muted">General</text><rect x="20" y="250" width="250" height="56" rx="12" fill="#30203d"/><rect x="20" y="250" width="4" height="56" rx="2" fill="#078fe8"/><text x="42" y="286" font-size="17" font-weight="700">Game</text><text x="42" y="352" font-size="17" class="muted">Content</text><text x="42" y="418" font-size="17" class="muted">Settings</text>
<text x="340" y="92" font-size="34" font-weight="750">Game</text><text x="340" y="126" font-size="15" class="muted">Choose which game and client this profile will launch.</text>
<rect x="340" y="160" width="1208" height="238" rx="16" fill="#14141d" stroke="#30303e" stroke-width="1.5"/><text x="376" y="210" font-size="22" font-weight="700">Game</text><text x="376" y="239" font-size="14" class="muted">Choose one. This filters the available clients and content.</text>
