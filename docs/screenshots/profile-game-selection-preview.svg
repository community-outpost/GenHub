<g><rect x="376" y="639" width="1136" height="74" fill="#211b2e"/><circle cx="410" cy="676" r="10" fill="#7840c7" stroke="#c9a7ed" stroke-width="2"/><circle cx="410" cy="676" r="4" fill="white"/><text x="444" y="682" font-size="16" font-weight="650">TheSuperHackers</text><rect x="596" y="661" width="72" height="28" rx="6" fill="#252431" stroke="#464255"/><text x="611" y="680" font-size="12" fill="#c6c1d2">Weekly</text><text x="1048" y="682" font-size="14" class="muted">Weekly build</text><text x="1280" y="682" font-size="14" class="muted">—</text></g>
