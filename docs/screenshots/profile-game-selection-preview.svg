<rect x="340" y="424" width="1208" height="484" rx="16" fill="#14141d" stroke="#30303e" stroke-width="1.5"/><text x="376" y="474" font-size="22" font-weight="700">Game client</text><text x="376" y="503" font-size="14" class="muted">Choose one client for Zero Hour.</text><text x="390" y="548" font-size="11" font-weight="700" letter-spacing="1.2" class="dim">CLIENT</text><text x="1048" y="548" font-size="11" font-weight="700" letter-spacing="1.2" class="dim">VERSION</text><text x="1280" y="548" font-size="11" font-weight="700" letter-spacing="1.2" class="dim">LAST UPDATED</text><path d="M376 564h1136" stroke="#30303e"/>
