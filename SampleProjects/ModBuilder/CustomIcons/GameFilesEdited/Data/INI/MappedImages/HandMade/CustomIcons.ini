; -----------------------------------------------------------------------------
; ModBuilder Sample Project: CustomIcons
; MappedImages/HandMade/CustomIcons.ini
; 
; Demonstrates how custom unit, structure, and ability icons are mapped to texture sheets.
; The SAGE engine references these MappedImage names in:
;   - CommandButton.ini: ButtonImage = <MappedImageName>
;   - Object/*.ini: SelectPortrait = <MappedImageName>
; -----------------------------------------------------------------------------

MappedImage SACrusaderCustom
  Texture = CustomUnitIcons.tga
  TextureWidth = 64
  TextureHeight = 64
  Coords = Left:0 Top:0 Right:31 Bottom:31
  Status = NONE
End

MappedImage SAPaladinCustom
  Texture = CustomUnitIcons.tga
  TextureWidth = 64
  TextureHeight = 64
  Coords = Left:32 Top:0 Right:63 Bottom:31
  Status = NONE
End

MappedImage SUWorkerCustom
  Texture = CustomUnitIcons.tga
  TextureWidth = 64
  TextureHeight = 64
  Coords = Left:0 Top:32 Right:31 Bottom:63
  Status = NONE
End

MappedImage SNTankHunterCustom
  Texture = CustomUnitIcons.tga
  TextureWidth = 64
  TextureHeight = 64
  Coords = Left:32 Top:32 Right:63 Bottom:63
  Status = NONE
End
