; -----------------------------------------------------------------------------
; ModBuilder Sample Project: CustomIcons & Hotkeys
; MappedImages/HandMade/HotkeyIndicators.ini
;
; Demonstrates how hotkey indicator overlays are defined (as used by Legionnaire's Hotkeys
; and Leikeze Hotkey Indicators from the Community Outpost provider).
;
; These overlay badges display hotkey letters ([Q], [W], [E], [R], etc.) in the corner of
; command button slots, helping players learn and execute build commands quickly.
; -----------------------------------------------------------------------------

