; -----------------------------------------------------------------------------
; ModBuilder Sample Project: CustomIcons & Hotkeys
; Data/INI/CommandButton.ini
;
; Demonstrates how CommandButtons in Zero Hour connect:
;   1. Custom Cameo Icons (ButtonImage = SACrusaderCustom, SAPaladinCustom, etc.)
;   2. Legionnaire-style QWERTY Hotkeys (KeyBinding = KEY_Q, KEY_W, KEY_E, etc.)
;   3. Tooltip Labels pointing to localized string table entries
; -----------------------------------------------------------------------------

CommandButton Command_ConstructAmericaVehicleCrusader
  Command = UNIT_BUILD
  Object = AmericaVehicleCrusader
  TextLabel = CONTROLBAR:ConstructAmericaVehicleCrusader
  ButtonImage = SACrusaderCustom
  ButtonBorderType = ACTION
  DescriptLabel = CONTROLBAR:ToolTipAmericaVehicleCrusaderHotkey
  KeyBinding = KEY_Q
End

CommandButton Command_ConstructAmericaVehiclePaladin
  Command = UNIT_BUILD
  Object = AmericaVehiclePaladin
  TextLabel = CONTROLBAR:ConstructAmericaVehiclePaladin
  ButtonImage = SAPaladinCustom
  ButtonBorderType = ACTION
  DescriptLabel = CONTROLBAR:ToolTipAmericaVehiclePaladinHotkey
  KeyBinding = KEY_W
End

CommandButton Command_ConstructGLAInfantryWorker
