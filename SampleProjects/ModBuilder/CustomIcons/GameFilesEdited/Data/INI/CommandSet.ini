; -----------------------------------------------------------------------------
; ModBuilder Sample Project: CustomIcons & Hotkeys
; Data/INI/CommandSet.ini
;
; Demonstrates how command buttons are mapped into standard grid slots.
; In Legionnaire's QWERTY layout:
;   Row 1: Slot 1 (Q), Slot 2 (W), Slot 3 (E), Slot 4 (R)
;   Row 2: Slot 5 (A), Slot 6 (S), Slot 7 (D), Slot 8 (F)
;   Row 3: Slot 9 (Z), Slot 10 (X), Slot 11 (C), Slot 12 (V)
;   Slot 13 / 14: Special Actions / Rally Point / Sell / Power
; -----------------------------------------------------------------------------

CommandSet AmericaWarFactoryCommandSet
  1 = Command_ConstructAmericaVehicleCrusader   ; Grid slot 1 -> Key Q
  2 = Command_ConstructAmericaVehiclePaladin    ; Grid slot 2 -> Key W
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet GLACommandCenterCommandSet
  1 = Command_ConstructGLAInfantryWorker        ; Grid slot 1 -> Key Q
  13 = Command_SetRallyPoint
  14 = Command_Sell
End

CommandSet ChinaBarracksCommandSet
  2 = Command_ConstructChinaInfantryTankHunter  ; Grid slot 2 -> Key W
  13 = Command_SetRallyPoint
  14 = Command_Sell
End
