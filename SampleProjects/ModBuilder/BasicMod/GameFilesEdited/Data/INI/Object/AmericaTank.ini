; Modified by BasicMod sample - demonstrates INI file editing
; Original: Health = 500, Speed = 50
; Modified: Health = 1000, Speed = 75

Object AmericaTank
  ; *** ART Parameters ***
  SelectPortrait         = SAPatriot_L
  ButtonImage            = SAPatriot

  Draw = W3DTankDraw ModuleTag_01
    OkToChangeModelColor = Yes

    DefaultConditionState
      Model               = AVCrusader
      Turret              = TURRET01
      WeaponLaunchBone    = PRIMARY WeaponA
    End

    ConditionState        = REALLYDAMAGED
      Model               = AVCrusader_D
      Turret              = TURRET01
      WeaponLaunchBone    = PRIMARY WeaponA
    End

    ConditionState        = RUBBLE
      Model               = AVCrusader_D3
    End
  End

  ; ***DESIGN parameters ***
  DisplayName      = OBJECT:Crusader
  Side             = America
  EditorSorting    = VEHICLE
  TransportSlotCount = 3                 ;how many "slots" we take in a transport (0 == not transportable)

  WeaponSet
    Conditions      = None
    Weapon          = PRIMARY CrusaderTankGun
  End

  ArmorSet
    Conditions      = None
    Armor           = TankArmor
  End

  VisionRange     = 200
  ShroudClearingRange = 400

  Prerequisites
    Object = AmericaWarFactory
  End

  ; *** AUDIO Parameters ***
  VoiceSelect = CrusaderVoiceSelect
  VoiceMove = CrusaderVoiceMove
  VoiceAttack = CrusaderVoiceAttack
  SoundMoveStart = CrusaderMoveStart
  SoundMoveStartDamaged = CrusaderMoveStart

  ; *** ENGINEERING Parameters ***
  RadarPriority = UNIT
  KindOf = PRELOAD SELECTABLE CAN_ATTACK ATTACK_NEEDS_LINE_OF_SIGHT CAN_CAST_REFLECTIONS VEHICLE SCORE TRANSPORT

  Body = ActiveBody ModuleTag_02
    MaxHealth       = 1000.0    ; MODIFIED: Was 500.0 - doubled health for demonstration
    InitialHealth   = 1000.0    ; MODIFIED: Was 500.0 - doubled health for demonstration
  End

  Behavior = AIUpdateInterface ModuleTag_03
    AutoAcquireEnemiesWhenIdle = Yes
    MoodAttackCheckRate = 500
  End

  Locomotor = SET_NORMAL CrusaderLocomotor
  Locomotor = SET_WADING GenericTankLocomotor

  Behavior = PhysicsBehavior ModuleTag_04
    Mass = 50.0
  End

  Behavior = ProductionUpdate ModuleTag_09
    MaxQueueEntries = 1; So you can't build multiple upgrades in the same frame
  End

  Geometry = CYLINDER
  GeometryMajorRadius = 14.0
  GeometryHeight = 10.0
  GeometryIsSmall = No
  Shadow = SHADOW_VOLUME
  ShadowSizeX = 45  ; minimum elevation angle above horizon. Used to limit shadow length

End
