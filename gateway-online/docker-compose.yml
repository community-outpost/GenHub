services:
  gateway:
    image: node:20-slim
    container_name: genhub-gateway
    restart: unless-stopped
    working_dir: /app
    environment:
      - JWT_SIGNING_SECRET=${JWT_SIGNING_SECRET:-3d136e1f1decb284cdc457efe31ba7a30910ac7bd536c63c6c19e2bcb054c434}
      - PASSWORD_PEPPER=${PASSWORD_PEPPER:-a78f2190c10b42f689e4726cd5e3a8910b82f810237894a7e9182379b8f10271}
      - COTURN_SECRET=${COTURN_SECRET:-7239fb840a1b827e481c9028fa109823ef081297a81093bc928172901928374a}
      - TURN_URIS=${TURN_URIS:-turn:152.70.171.121:3478?transport=udp,turn:152.70.171.121:3478?transport=tcp}
      - EMPTY_NETWORK_TTL_SECONDS=${EMPTY_NETWORK_TTL_SECONDS:-5}
    volumes:
      - ./:/app
      - ./data:/data
    command: >
      sh -c "npx wrangler dev --ip 0.0.0.0 --port 8787 --persist-to /data"
    ports:
      - "8787:8787"

  relay:
    image: node:20-slim
    container_name: genhub-relay
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    command: node /app/relay.js
    ports:
      - "8088:8088/udp"

  coturn:
    image: coturn/coturn:latest
    container_name: genhub-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - "-n"
      - "--listening-port=3478"
      - "--fingerprint"
      - "--realm=genhub.online"
      - "--use-auth-secret"
      - "--static-auth-secret=${COTURN_SECRET:-7239fb840a1b827e481c9028fa109823ef081297a81093bc928172901928374a}"
      - "--external-ip=152.70.171.121/10.0.0.197"
      - "--min-port=49152"
      - "--max-port=49252"
      - "--no-cli"
