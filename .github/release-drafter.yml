name-template: 'GenHub Alpha v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# All GenHub releases are prereleases. Without this, release-drafter ignores
# every published release when resolving the previous version, so the draft
# falls back to v0.1.0 with notes spanning the entire repository history.
include-pre-releases: true

# Drafts must stay prereleases so the draft matcher finds its own draft and a
# mistakenly published draft can never go out as a full release.
prerelease: true

categories:
  - title: '🚀 New Features & Enhancements'
    labels:
      - 'Enhancement'
      - 'enhancement'
      - 'Feature'
      - 'feature'
      - 'feat'
  - title: '🎨 User Interface & Experience'
    labels:
      - 'GUI'
      - 'Design'
      - 'ui'
      - 'ux'
  - title: '🛠️ Tools & Engine Integrations'
    labels:
      - 'Tools'
      - 'tools'
      - 'Mapping'
  - title: '📦 Content Pipeline & Distribution'
    labels:
      - 'Content-Pipeline'
  - title: '🐛 Bug Fixes & Stability'
    labels:
      - 'Fix'
      - 'Bug'
      - 'bug'
  - title: '⚙️ Core Engine & Services'
    labels:
      - 'Core-service'
      - 'Architecture'
  - title: '⚡ Performance'
    labels:
      - 'Performance'
      - 'performance'
  - title: '🧰 Maintenance & Code Quality'
    labels:
      - 'Refactor'
      - 'refactor'
      - 'refactoring'
      - 'Chore'
      - 'chore'
      - 'Infrastructure'
      - 'Testing'
  - title: '📖 Documentation'
    labels:
      - 'Documentation'
      - 'documentation'
      - 'docs'

change-template: '- $TITLE (@$AUTHOR in #$NUMBER)'
change-title-escapes: '\<*_&'

version-resolver:
  # Alpha releases progress as 0.0.x patches only. Keep major and minor empty
  # until 0.1.0 is intentionally cut, otherwise any Enhancement label resolves
  # the next draft to v0.1.0 instead of v0.0.4.
  major:
    labels: []
  minor:
    labels: []
  patch:
    labels:
      - 'Fix'
      - 'Bug'
      - 'Refactor'
      - 'Chore'
      - 'Infrastructure'
  default: patch

autolabeler:
  - label: 'Enhancement'
    title:
      - '/^feat(\(.*\))?:/i'
    branch:
      - '/^feat\/.*/i'
  - label: 'Fix'
    title:
      - '/^fix(\(.*\))?:/i'
    branch:
      - '/^fix\/.*/i'
  - label: 'Chore'
    title:
      - '/^chore(\(.*\))?:/i'
    branch:
      - '/^chore\/.*/i'
  - label: 'Refactor'
    title:
      - '/^refactor(\(.*\))?:/i'
    branch:
      - '/^refactor\/.*/i'
  - label: 'Documentation'
    title:
      - '/^docs(\(.*\))?:/i'
    branch:
      - '/^docs\/.*/i'
  - label: 'Testing'
    title:
      - '/^test(\(.*\))?:/i'

template: |
  ## What's Changed in GenHub Alpha v$RESOLVED_VERSION

  $CHANGES

  ### Contributors
  A huge thank you to everyone who contributed to this release:
  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
