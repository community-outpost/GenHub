name: Deploy Online Edge

on:
  push:
    branches: [development]
    paths:
      - 'gateway-online/**'
      - '.github/workflows/deploy-online-edge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: online-edge

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway-online
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway-online/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run types

      - name: Test
        run: npm test

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
