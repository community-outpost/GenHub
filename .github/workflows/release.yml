name: GenHub Release

permissions:
  contents: write
  actions: read

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit on main to promote
        required: true
        default: main
      version:
        description: SemVer release version without the leading v
        required: true

concurrency:
  group: release-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: 'Release'
  CORE_PROJECT: 'GenHub/GenHub.Core/GenHub.Core.csproj'
  UI_PROJECT: 'GenHub/GenHub/GenHub.csproj'
  WINDOWS_PROJECT: 'GenHub/GenHub.Windows/GenHub.Windows.csproj'
  LINUX_PROJECT: 'GenHub/GenHub.Linux/GenHub.Linux.csproj'
  MACOS_PROJECT: 'GenHub/GenHub.MacOS/GenHub.MacOS.csproj'
  TEST_PROJECTS: 'GenHub/GenHub.Tests/**/*.csproj'

jobs:
  promote:
    name: Verify Release Promotion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout promoted ref
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Resolve and validate release
        id: release
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          git fetch origin main
          git merge-base --is-ancestor "$sha" origin/main || {
            echo "::error::Release ref must resolve to a commit on main."
            exit 1
          }

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$MANUAL_VERSION"
          fi

          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "$version" =~ $semver ]]; then
            echo "::error::Version must be valid SemVer without a leading v."
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require successful CI for promoted commit
        uses: actions/github-script@v7
        with:
          script: |
            const sha = '${{ steps.release.outputs.sha }}';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              head_sha: sha,
              status: 'success',
              per_page: 100,
            });

            const successfulPush = data.workflow_runs.find(
              run => run.event === 'push' && run.conclusion === 'success'
            );

            if (!successfulPush) {
              core.setFailed(`No successful GenHub CI push run exists for ${sha} on main.`);
              return;
            }

            core.info(`Using successful CI run ${successfulPush.html_url}`);

  build-windows:
    name: Build Windows
    needs: promote
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promote.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract Build Info
        id: buildinfo
        shell: pwsh
        run: |
          $version = "${{ needs.promote.outputs.version }}"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Run Release Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $testProjects = Get-ChildItem -Path "GenHub/GenHub.Tests" -Recurse -Filter *.csproj |
            Where-Object { $_.Name -notlike '*Linux*' -and $_.Name -notlike '*MacOS*' }

          if (-not $testProjects) {
            throw "No Windows-compatible test projects found."
          }

          foreach ($testProject in $testProjects) {
            dotnet test $testProject.FullName -c $env:BUILD_CONFIGURATION
            if ($LASTEXITCODE -ne 0) {
              throw "Tests failed for $($testProject.FullName)"
            }
          }

      - name: Publish Windows App
        shell: pwsh
        run: |
          dotnet publish "${{ env.WINDOWS_PROJECT }}" `
            -c ${{ env.BUILD_CONFIGURATION }} `
            -r win-x64 `
            --self-contained true `
            -o "win-publish" `
            -p:Version=${{ steps.buildinfo.outputs.VERSION }} `
            -p:BuildChannel=Release

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> $env:GITHUB_PATH

      - name: Download Previous Release For Deltas
        id: delta_baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path velopack-release-windows | Out-Null
          vpk download github `
            --repoUrl "https://github.com/${{ github.repository }}" `
            --outputDir velopack-release-windows `
            --pre `
            --token "${{ secrets.GITHUB_TOKEN }}"
          $downloadOk = ($LASTEXITCODE -eq 0)
          if (-not $downloadOk) {
            # Drop partial downloads so the pack starts from a clean baseline.
            Get-ChildItem -Path velopack-release-windows/*-full.nupkg -ErrorAction SilentlyContinue | Remove-Item -Force
          }
          # vpk download can exit 0 without writing a baseline (no feed yet),
          # so only a non-empty full package counts as an available baseline.
          $baseline = @(Get-ChildItem -Path velopack-release-windows/*-full.nupkg -ErrorAction SilentlyContinue | Where-Object Length -gt 0)
          if ($downloadOk -and $baseline.Count -gt 0) {
            echo "available=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "WARNING: No previous release available for delta baseline; continuing with full-only package."
          }

      - name: Create Velopack Windows Package
        shell: pwsh
        run: |
          vpk pack `
            --packId GenHub `
            --packVersion ${{ steps.buildinfo.outputs.VERSION }} `
            --packDir win-publish `
            --mainExe GenHub.Windows.exe `
            --packTitle "GenHub" `
            --packAuthors "Community Outpost" `
            --icon GenHub/GenHub/Assets/Icons/generalshub.ico `
            --outputDir velopack-release-windows

          # Prune the downloaded previous full package: each GitHub release carries
          # only its own full package plus its delta (see docs/releases.md).
          Get-ChildItem -Path velopack-release-windows/*-full.nupkg -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -ne "GenHub-${{ steps.buildinfo.outputs.VERSION }}-full.nupkg" } |
            Remove-Item -Force

          # Rename metadata to prevent collisions with Linux
          Rename-Item -Path "velopack-release-windows\releases.json" -NewName "releases.win.json" -ErrorAction SilentlyContinue
          Rename-Item -Path "velopack-release-windows\assets.json" -NewName "assets.win.json" -ErrorAction SilentlyContinue

      - name: Create Portable Windows Build
        shell: pwsh
        run: |
          $portableDir = "GenHub-Portable"
          New-Item -ItemType Directory -Force -Path $portableDir
          Copy-Item -Path "win-publish\*" -Destination $portableDir -Recurse -Force
          $zipName = "GenHub-${{ steps.buildinfo.outputs.VERSION }}-win-portable.zip"
          Compress-Archive -Path $portableDir -DestinationPath $zipName -Force

      - name: Smoke Test Windows Release Assets
        shell: pwsh
        run: |
          $requiredPatterns = @(
            "win-publish/GenHub.Windows.exe",
            "velopack-release-windows/GenHub-${{ steps.buildinfo.outputs.VERSION }}-full.nupkg",
            "velopack-release-windows/*-Setup.exe",
            "velopack-release-windows/RELEASES",
            "GenHub-${{ steps.buildinfo.outputs.VERSION }}-win-portable.zip"
          )

          foreach ($pattern in $requiredPatterns) {
            $files = Get-ChildItem $pattern -ErrorAction SilentlyContinue
            if (-not $files -or ($files | Where-Object Length -eq 0)) {
              throw "Missing or empty release asset: $pattern"
            }
          }

          if ("${{ steps.delta_baseline.outputs.available }}" -eq "true") {
            $delta = @(Get-ChildItem "velopack-release-windows/*-delta.nupkg" -ErrorAction SilentlyContinue | Where-Object Length -gt 0)
            if ($delta.Count -eq 0) {
              throw "Delta baseline was downloaded but vpk pack generated no delta package."
            }
            Write-Host ("Delta package: {0} ({1:N1} MB)" -f $delta[0].Name, ($delta[0].Length / 1MB))
          }

      - name: Generate Publish Inventory
        shell: pwsh
        run: |
          Get-ChildItem -Path win-publish -Recurse -File |
            Sort-Object Length -Descending |
            Select-Object @{Name="Bytes"; Expression={ $_.Length }}, @{Name="Path"; Expression={ $_.FullName }} |
            Format-Table -AutoSize |
            Out-File -FilePath velopack-release-windows/publish-inventory.txt -Encoding utf8
          $totalMB = ((Get-ChildItem -Path win-publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          Write-Host ("Publish total: {0:N1} MB (see publish-inventory.txt)" -f $totalMB)

      - name: Enforce Installer Size Budget
        shell: pwsh
        run: |
          $budgetMB = 85
          $setup = Get-ChildItem -Path velopack-release-windows/*-Setup.exe | Select-Object -First 1
          $sizeMB = $setup.Length / 1MB
          Write-Host ("Setup.exe: {0:N1} MB (budget {1} MB)" -f $sizeMB, $budgetMB)
          if ($sizeMB -gt $budgetMB) {
            throw ("Installer size budget exceeded: {0:N1} MB > {1} MB. See publish-inventory.txt." -f $sizeMB, $budgetMB)
          }

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-release
          path: velopack-release-windows/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-portable
          path: "GenHub-*-win-portable.zip"
          if-no-files-found: error
          retention-days: 1

  build-linux:
    name: Build Linux
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promote.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract Build Info
        id: buildinfo
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Release Tests
        run: |
          shopt -s globstar nullglob
          test_projects=(${{ env.TEST_PROJECTS }})
          if [ "${#test_projects[@]}" -eq 0 ]; then
            echo "::error::No Linux-compatible test projects found."
            exit 1
          fi

          for test_project in "${test_projects[@]}"; do
            [[ "$test_project" == *Windows* || "$test_project" == *MacOS* ]] && continue
            dotnet test "$test_project" -c "${{ env.BUILD_CONFIGURATION }}"
          done

      - name: Publish Linux App
        run: |
          dotnet publish "${{ env.LINUX_PROJECT }}" \
            -c ${{ env.BUILD_CONFIGURATION }} \
            -r linux-x64 \
            --self-contained true \
            -o "linux-publish" \
            -p:Version="${{ steps.buildinfo.outputs.VERSION }}" \
            -p:BuildChannel=Release

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Download Previous Release For Deltas
        id: delta_baseline
        run: |
          mkdir -p velopack-release-linux
          download_ok=0
          if vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --outputDir velopack-release-linux \
            --pre \
            --token "${{ secrets.GITHUB_TOKEN }}"; then
            download_ok=1
          else
            # Drop partial downloads so the pack starts from a clean baseline.
            rm -f velopack-release-linux/*-full.nupkg
          fi
          # vpk download can exit 0 without writing a baseline (no feed yet),
          # so only a non-empty full package counts as an available baseline.
          if [ "$download_ok" = "1" ] && find velopack-release-linux -maxdepth 1 -name '*-full.nupkg' -size +0c -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No previous release available for delta baseline; continuing with full-only package."
          fi

      - name: Create Velopack Linux Package
        run: |
          vpk pack \
            --packId GenHub \
            --packVersion "${{ steps.buildinfo.outputs.VERSION }}" \
            --packDir linux-publish \
            --mainExe GenHub.Linux \
            --packTitle "GenHub" \
            --packAuthors "Community Outpost" \
            --icon GenHub/GenHub/Assets/Icons/generalshub-icon.png \
            --outputDir velopack-release-linux

          # Prune the downloaded previous full package: each GitHub release carries
          # only its own full package plus its delta (see docs/releases.md).
          # Velopack appends the channel outside Windows: GenHub-<v>-linux-full.nupkg.
          find velopack-release-linux -maxdepth 1 -name '*-full.nupkg' \
            ! -name "GenHub-${{ steps.buildinfo.outputs.VERSION }}-linux-full.nupkg" -delete

          # Rename metadata to prevent collisions with Windows
          mv velopack-release-linux/releases.json velopack-release-linux/releases.linux.json || true
          mv velopack-release-linux/assets.json velopack-release-linux/assets.linux.json || true

      - name: Smoke Test Linux Release Assets
        run: |
          set -euo pipefail
          test -x linux-publish/GenHub.Linux
          compgen -G 'velopack-release-linux/*.AppImage' > /dev/null
          test -s "velopack-release-linux/GenHub-${{ steps.buildinfo.outputs.VERSION }}-linux-full.nupkg"
          if [ "${{ steps.delta_baseline.outputs.available }}" = "true" ]; then
            compgen -G 'velopack-release-linux/*-delta.nupkg' > /dev/null || {
              echo "::error::Delta baseline was downloaded but vpk pack generated no delta package."
              exit 1
            }
            ls -lh velopack-release-linux/*-delta.nupkg
          fi
          if find velopack-release-linux -type f -size 0 -print -quit | grep -q .; then
            echo "::error::A Linux release asset is empty."
            exit 1
          fi

      - name: Generate Publish Inventory
        run: |
          set -euo pipefail
          find linux-publish -type f -printf '%s %p\n' | sort -rn > velopack-release-linux/publish-inventory.txt
          total_mb=$(awk '{s+=$1} END {printf "%.1f", s/1024/1024}' velopack-release-linux/publish-inventory.txt)
          echo "Publish total: ${total_mb} MB (see publish-inventory.txt)"
          du -sh velopack-release-linux/*.AppImage

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-release
          path: velopack-release-linux/*
          if-no-files-found: error
          retention-days: 1

  build-macos:
    name: Build macOS
    needs: promote
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promote.outputs.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract Build Info
        id: buildinfo
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Run Release Tests
        run: |
          dotnet test GenHub/GenHub.Tests/GenHub.Tests.MacOS/GenHub.Tests.MacOS.csproj \
            -c ${{ env.BUILD_CONFIGURATION }}

      - name: Publish macOS App
        run: |
          dotnet publish "${{ env.MACOS_PROJECT }}" \
            -c ${{ env.BUILD_CONFIGURATION }} \
            -r osx-arm64 \
            --self-contained true \
            -o "macos-publish" \
            -p:Version="${{ steps.buildinfo.outputs.VERSION }}" \
            -p:BuildChannel=Release

      - name: Create .app Bundle
        run: |
          .github/scripts/package-macos-app.sh \
            macos-publish \
            macos-dist \
            "${{ steps.buildinfo.outputs.VERSION }}"

      - name: Smoke Test App Launch
        run: |
          APP_BIN="macos-dist/GenHub.app/Contents/MacOS/GenHub.MacOS"
          "$APP_BIN" > app-launch.log 2>&1 &
          APP_PID=$!

          SURVIVED=0
          for _ in $(seq 1 "${MACOS_SMOKE_TEST_SECONDS:-15}"); do
            sleep 1
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
            SURVIVED=$((SURVIVED + 1))
          done

          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "App stayed up for ${SURVIVED}s"
            if kill "$APP_PID" 2>/dev/null; then
              wait "$APP_PID" 2>/dev/null || true
            else
              set +e
              wait "$APP_PID"
              APP_STATUS=$?
              set -e
              echo "::error::GenHub.app exited before CI could stop it (status $APP_STATUS). Log follows."
              cat app-launch.log
              exit 1
            fi
          else
            set +e
            wait "$APP_PID"
            APP_STATUS=$?
            set -e
            echo "::error::GenHub.app exited during startup (status $APP_STATUS). Log follows."
            cat app-launch.log
            exit 1
          fi
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          MACOS_SMOKE_TEST_SECONDS: '15'

      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Download Previous Release For Deltas
        id: delta_baseline
        run: |
          mkdir -p velopack-release-macos
          download_ok=0
          if vpk download github \
            --repoUrl "https://github.com/${{ github.repository }}" \
            --outputDir velopack-release-macos \
            --pre \
            --token "${{ secrets.GITHUB_TOKEN }}"; then
            download_ok=1
          else
            # Drop partial downloads so the pack starts from a clean baseline.
            rm -f velopack-release-macos/*-full.nupkg
          fi
          # vpk download can exit 0 without writing a baseline (no feed yet),
          # so only a non-empty full package counts as an available baseline.
          if [ "$download_ok" = "1" ] && find velopack-release-macos -maxdepth 1 -name '*-full.nupkg' -size +0c -print -quit | grep -q .; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No previous release available for delta baseline; continuing with full-only package."
          fi

      - name: Create Velopack macOS Package
        run: |
          echo "Packaging macOS app bundle with Velopack..."
          ICON_ARG=""
          if [ -f "macos-dist/GenHub.app/Contents/Resources/AppIcon.icns" ]; then
            ICON_ARG="--icon macos-dist/GenHub.app/Contents/Resources/AppIcon.icns"
          elif [ -f "GenHub/GenHub/Assets/Icons/generalshub.icns" ]; then
            ICON_ARG="--icon GenHub/GenHub/Assets/Icons/generalshub.icns"
          fi

          vpk pack \
            --packId GenHub \
            --packVersion "${{ steps.buildinfo.outputs.VERSION }}" \
            --packDir macos-dist/GenHub.app \
            --mainExe GenHub.MacOS \
            --packTitle "GenHub" \
            --packAuthors "Community Outpost" \
            $ICON_ARG \
            --outputDir velopack-release-macos

          # Prune the downloaded previous full package: each GitHub release carries
          # only its own full package plus its delta (see docs/releases.md).
          # Velopack appends the channel outside Windows: GenHub-<v>-osx-full.nupkg.
          find velopack-release-macos -maxdepth 1 -name '*-full.nupkg' \
            ! -name "GenHub-${{ steps.buildinfo.outputs.VERSION }}-osx-full.nupkg" -delete

          # Rename metadata to prevent collisions with Windows and Linux
          mv velopack-release-macos/releases.json velopack-release-macos/releases.osx.json || true
          mv velopack-release-macos/assets.json velopack-release-macos/assets.osx.json || true

      - name: Smoke Test macOS Release Assets
        run: |
          set -euo pipefail
          test -x macos-dist/GenHub.app/Contents/MacOS/GenHub.MacOS
          compgen -G 'velopack-release-macos/*.pkg' > /dev/null
          test -s "velopack-release-macos/GenHub-${{ steps.buildinfo.outputs.VERSION }}-osx-full.nupkg"
          if [ "${{ steps.delta_baseline.outputs.available }}" = "true" ]; then
            compgen -G 'velopack-release-macos/*-delta.nupkg' > /dev/null || {
              echo "::error::Delta baseline was downloaded but vpk pack generated no delta package."
              exit 1
            }
            ls -lh velopack-release-macos/*-delta.nupkg
          fi
          if find velopack-release-macos -type f -size 0 -print -quit | grep -q .; then
            echo "::error::A macOS release asset is empty."
            exit 1
          fi

      - name: Generate Publish Inventory
        run: |
          set -euo pipefail
          find macos-publish -type f -exec stat -f '%z %N' {} + 2>/dev/null | sort -rn > velopack-release-macos/publish-inventory.txt || \
            find macos-publish -type f -printf '%s %p\n' | sort -rn > velopack-release-macos/publish-inventory.txt
          total_mb=$(awk '{s+=$1} END {printf "%.1f", s/1024/1024}' velopack-release-macos/publish-inventory.txt)
          echo "Publish total: ${total_mb} MB (see publish-inventory.txt)"
          du -sh velopack-release-macos/*.pkg

      - name: Upload macOS Release Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: macos-release
          path: velopack-release-macos/*
          if-no-files-found: error
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [promote, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.promote.outputs.sha }}
          fetch-depth: 0

      - name: Extract Info
        id: info
        run: |
          VERSION="${{ needs.promote.outputs.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          git fetch --tags --force
          PREVIOUS_TAG=$(git tag --merged HEAD --sort=-v:refname | grep -E '^v[0-9]' | grep -vx "v${VERSION}" | head -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" -10)
            COUNT="10"
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..HEAD)
            COUNT=$(git rev-list --count ${PREVIOUS_TAG}..HEAD)
          fi
          echo "COUNT=$COUNT" >> $GITHUB_OUTPUT
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "FALLBACK_BODY<<EOF" >> $GITHUB_OUTPUT
          echo "## GenHub Alpha v${VERSION}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "### 🆕 What's New" >> $GITHUB_OUTPUT
          echo "**${COUNT} commits** included:" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Release Notes via Release Drafter
        id: release_drafter
        uses: release-drafter/release-drafter@b1476f6e6eb133afa41ed8589daba6dc69b4d3f5 # v6.1.0
        continue-on-error: true
        with:
          version: ${{ steps.info.outputs.VERSION }}
          tag: v${{ steps.info.outputs.VERSION }}
          commitish: ${{ needs.promote.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download All Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Prepare Assets
        run: |
          mkdir final-assets
          # Copy only specific files to avoid duplicates
          # 1. Windows Setup and NuPkgs
          find artifacts/windows-release -type f \( -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" -o -name "*.json" \) -exec cp {} final-assets/ \;
          # 2. Linux AppImage, NuPkgs and Json
          find artifacts/linux-release -type f \( -name "*.AppImage" -o -name "*.nupkg" -o -name "RELEASES-*" -o -name "*.json" \) -exec cp {} final-assets/ \;
          # 3. macOS Setup (.pkg), NuPkgs and Json
          find artifacts/macos-release -type f \( -name "*.pkg" -o -name "*.nupkg" -o -name "RELEASES-*" -o -name "*.json" \) -exec cp {} final-assets/ \;
          # 4. Windows Portable (Specific match)
          cp artifacts/windows-portable/*.zip final-assets/

          ls -lh final-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.info.outputs.VERSION }}
          target_commitish: ${{ needs.promote.outputs.sha }}
          name: GenHub Alpha v${{ steps.info.outputs.VERSION }}
          prerelease: true
          body: |
            ${{ steps.release_drafter.outputs.body != '' && steps.release_drafter.outputs.body || steps.info.outputs.FALLBACK_BODY }}

            ### 🔧 Assets
            - **Windows Installer:** [GenHub-win-Setup.exe](https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.VERSION }}/GenHub-win-Setup.exe) *(supports custom install directory via `--installto <path>` / `-t <path>`)*
            - **Windows Portable:** [GenHub-${{ steps.info.outputs.VERSION }}-win-portable.zip](https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.VERSION }}/GenHub-${{ steps.info.outputs.VERSION }}-win-portable.zip)
            - **Linux Installer:** [GenHub.AppImage](https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.VERSION }}/GenHub.AppImage)
            - **macOS Installer:** [GenHub-osx-Setup.pkg](https://github.com/${{ github.repository }}/releases/download/v${{ steps.info.outputs.VERSION }}/GenHub-osx-Setup.pkg)
          files: final-assets/*
