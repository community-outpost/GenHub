name: GitNexus Graph Update & Cache

permissions:
  contents: read

on:
  push:
    branches: [development, main, 'release/**']
  pull_request:
    branches: [development, main, 'release/**']
  workflow_dispatch:

concurrency:
  group: gitnexus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  index:
    name: GitNexus Index & Cache
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: 22

      - name: Cache GitNexus Graph
        id: cache-gitnexus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .gitnexus
          key: gitnexus-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gitnexus-${{ runner.os }}-

      - name: Analyze Codebase
        run: |
          npx -y gitnexus@1.6.9 analyze --index-only
          npx -y gitnexus@1.6.9 status

      - name: PR Impact Analysis
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "### 🔍 GitNexus Blast Radius & Change Impact" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          set -o pipefail
          npx -y gitnexus@1.6.9 detect-changes 2>&1 | tee -a $GITHUB_STEP_SUMMARY
          EXIT_CODE=${PIPESTATUS[0]}
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $EXIT_CODE

      - name: Upload GitNexus Knowledge Graph Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitnexus-graph-${{ github.sha }}
          path: .gitnexus/
          if-no-files-found: warn
          retention-days: 14
