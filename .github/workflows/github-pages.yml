name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main, development]
    paths:
      - 'Landing-page/**'
      - '.github/workflows/github-pages.yml'
  workflow_run:
    workflows: ["GenHub Release"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - id: release_info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          
          if [ -n "$LATEST_TAG" ]; then
            BUILD_NUM=$(echo "$LATEST_TAG" | cut -d'.' -f3)
            DISPLAY_NAME="Alpha ${BUILD_NUM}"
            DOWNLOAD_URL="https://github.com/community-outpost/GenHub/releases/download/${LATEST_TAG}/GenHub-win-Setup.exe"
          else
            LATEST_TAG="latest"
            DISPLAY_NAME="Alpha"
            DOWNLOAD_URL="https://github.com/community-outpost/GenHub/releases"
          fi
          
          echo "latest_tag=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "display_name=$DISPLAY_NAME" >> $GITHUB_OUTPUT
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - run: |
          mkdir -p ./public
          cp Landing-page/index.html ./public/index.html
          
          if [ -d "Landing-page/assets" ]; then
            cp -r Landing-page/assets ./public/assets
          fi
          
          # Create client-side redirect for legacy /wiki/ path on generalshub.com
          mkdir -p ./public/wiki
          cat << 'EOF_WIKI' > ./public/wiki/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting to GeneralsHub Wiki...</title>
            <link rel="canonical" href="https://wiki.generalshub.com/">
            <meta http-equiv="refresh" content="0; url=https://wiki.generalshub.com/">
            <script>window.location.replace("https://wiki.generalshub.com/" + window.location.search + window.location.hash);</script>
          </head>
          <body>
            <p>Redirecting to <a href="https://wiki.generalshub.com/">https://wiki.generalshub.com/</a>...</p>
          </body>
          </html>
          EOF_WIKI
          
          sed -i "s|VERSION_PLACEHOLDER|${{ steps.release_info.outputs.display_name }}|g" ./public/index.html
          sed -i "s|URL_PLACEHOLDER|${{ steps.release_info.outputs.download_url }}|g" ./public/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - uses: actions/deploy-pages@v4
