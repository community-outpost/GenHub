version = 1

test_patterns = [
  "GenHub/GenHub.Tests/**",
  "GenHub/**/Tests/**"
]

exclude_patterns = [
  "**/obj/**",
  "**/bin/**",
  "**/*.min.js"
]

[[analyzers]]
name = "csharp"
enabled = true

[[analyzers]]
name = "javascript"
enabled = true

[[analyzers]]
name = "shell"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
